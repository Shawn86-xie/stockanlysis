version: '3.8'

services:
  medportfolio:
    build: .
    container_name: medportfolio_2026
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/data/config.json
      # 用户认证配置（请修改为你自己的用户名和密码）
      - AUTH_USERNAME=shawn
      - AUTH_PASSWORD=snk2026
      - AUTH_NAME=管理员
      - AUTH_COOKIE_KEY=your_random_secret_key_here
      - AUTH_COOKIE_EXPIRY=7
      # 开发模式下可设置为true跳过认证
      # - AUTH_DISABLED=false
    volumes:
      # 挂载配置和数据目录
      - ./config.json:/app/data/config.json
      - ./data:/app/data
      # 挂载市场数据目录（K线等历史数据）
      - ./market_data:/app/market_data
      # 挂载日志目录
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - medportfolio_network

networks:
  medportfolio_network:
    driver: bridge

# 数据卷定义（如果需要独立的数据卷）
volumes:
  # 如果需要持久化数据卷，可以取消注释下面的配置
  # medportfolio_data:
  #   driver: local
  # medportfolio_logs:
  #   driver: local